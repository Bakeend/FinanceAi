<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" role="img" aria-labelledby="title desc">
<title>FinanceAi — Open source personal finance with AI</title>
<desc>Dark green FinanceAi project banner with finance charts, AI assistant and technology badges.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#06110d"/><stop offset=".55" stop-color="#081c14"/><stop offset="1" stop-color="#0b2a1c"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#70f5a7"/><stop offset="1" stop-color="#20c978"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="12" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1400" height="560" rx="32" fill="url(#bg)"/>
<circle cx="1260" cy="80" r="210" fill="#1bd17d" opacity=".07"/>
<circle cx="90" cy="520" r="250" fill="#1bd17d" opacity=".05"/>

<!-- Brand -->
<g transform="translate(72 84)">
  <g filter="url(#glow)" fill="url(#accent)">
    <rect x="0" y="48" width="22" height="54" rx="8"/><rect x="34" y="24" width="22" height="78" rx="8"/><rect x="68" y="0" width="22" height="102" rx="8"/>
    <path d="M4 118c35 24 78 20 112-8" fill="none" stroke="#39e893" stroke-width="11" stroke-linecap="round"/>
    <path d="M93 83l30-25v29h27" fill="none" stroke="#39e893" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="170" y="66" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="70" font-weight="800" fill="#fff">Finance<tspan fill="#46ed98">Ai</tspan></text>
  <text x="170" y="108" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="27" font-weight="600" fill="#dce8e1">Finanças pessoais com inteligência artificial.</text>

  <text x="0" y="184" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" fill="#aec2b7">Importe extratos, organize gastos, visualize tendências</text>
  <text x="0" y="218" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" fill="#aec2b7">e converse com seus próprios dados financeiros.</text>

  <!-- Feature pills -->
  <g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700">
    <g transform="translate(0 262)"><rect width="170" height="60" rx="16" fill="#0b261a" stroke="#1d5d40"/><text x="22" y="37" fill="#e8fff2">↗ Dashboard</text></g>
    <g transform="translate(184 262)"><rect width="172" height="60" rx="16" fill="#0b261a" stroke="#1d5d40"/><text x="22" y="37" fill="#e8fff2">✦ Insights IA</text></g>
    <g transform="translate(370 262)"><rect width="172" height="60" rx="16" fill="#0b261a" stroke="#1d5d40"/><text x="22" y="37" fill="#e8fff2">◫ CSV + PDF</text></g>
  </g>

  <!-- stack -->
  <g transform="translate(0 374)" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" fill="#bcd0c5">
    <text x="0" y="0">React</text><circle cx="73" cy="-6" r="3" fill="#3ce792"/>
    <text x="91" y="0">TypeScript</text><circle cx="202" cy="-6" r="3" fill="#3ce792"/>
    <text x="220" y="0">NestJS</text><circle cx="290" cy="-6" r="3" fill="#3ce792"/>
    <text x="308" y="0">SQLite</text><circle cx="365" cy="-6" r="3" fill="#3ce792"/>
    <text x="383" y="0">OpenRouter</text>
  </g>
  <text x="0" y="430" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#46ed98">OPEN SOURCE • LOCAL-FIRST • TYPESCRIPT</text>
</g>

<!-- Product mockup -->
<g transform="translate(760 70)">
  <rect width="570" height="420" rx="28" fill="#07100d" stroke="#246044" stroke-width="2"/>
  <rect x="24" y="22" width="522" height="55" rx="16" fill="#0c1b14"/>
  <text x="48" y="57" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="800" fill="#f4fff8">Visão geral</text>
  <circle cx="505" cy="49" r="10" fill="#38e58d"/>

  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <g transform="translate(24 96)"><rect width="162" height="86" rx="18" fill="#0c1b14" stroke="#173b2b"/><text x="18" y="28" font-size="14" fill="#8da89b">Receitas</text><text x="18" y="58" font-size="22" font-weight="800" fill="#f1fff7">R$ 4.850</text><text x="112" y="58" font-size="13" fill="#47ee99">+12%</text></g>
    <g transform="translate(204 96)"><rect width="162" height="86" rx="18" fill="#0c1b14" stroke="#173b2b"/><text x="18" y="28" font-size="14" fill="#8da89b">Despesas</text><text x="18" y="58" font-size="22" font-weight="800" fill="#f1fff7">R$ 2.340</text><text x="112" y="58" font-size="13" fill="#ff7c7c">-8%</text></g>
    <g transform="translate(384 96)"><rect width="162" height="86" rx="18" fill="#0c1b14" stroke="#173b2b"/><text x="18" y="28" font-size="14" fill="#8da89b">Saldo</text><text x="18" y="58" font-size="22" font-weight="800" fill="#f1fff7">R$ 2.510</text><text x="112" y="58" font-size="13" fill="#47ee99">+20%</text></g>
  </g>

  <rect x="24" y="202" width="342" height="188" rx="20" fill="#0c1b14" stroke="#173b2b"/>
  <text x="46" y="234" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#e8fff2">Evolução financeira</text>
  <path d="M48 340 C95 310,120 324,154 292 S220 306,250 266 S304 286,342 246" fill="none" stroke="#43e995" stroke-width="5" stroke-linecap="round"/>
  <path d="M48 362 C88 344,122 350,158 330 S220 340,256 314 S300 324,342 296" fill="none" stroke="#ff6f75" stroke-width="4" stroke-linecap="round"/>
  <line x1="48" y1="366" x2="342" y2="366" stroke="#244537"/>
  <g fill="#718d80" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11"><text x="48" y="382">Jan</text><text x="111" y="382">Fev</text><text x="176" y="382">Mar</text><text x="240" y="382">Abr</text><text x="305" y="382">Mai</text></g>

  <rect x="384" y="202" width="162" height="188" rx="20" fill="#0b281b" stroke="#2c8056"/>
  <text x="404" y="236" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="800" fill="#edfff5">Assistente IA</text>
  <circle cx="465" cy="283" r="30" fill="#153d2b" stroke="#3fea98" stroke-width="2"/>
  <path d="M451 286q14 14 28 0" fill="none" stroke="#49ed9b" stroke-width="4" stroke-linecap="round"/>
  <circle cx="454" cy="276" r="3" fill="#49ed9b"/><circle cx="476" cy="276" r="3" fill="#49ed9b"/>
  <text x="403" y="335" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" fill="#b8cfc3">“Onde posso</text>
  <text x="403" y="353" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" fill="#b8cfc3">economizar?”</text>
  <rect x="403" y="365" width="124" height="12" rx="6" fill="#1e4b36"/>
</g>
</svg>